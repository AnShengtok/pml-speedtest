[package]
name = "pml-shell"
version = "1.0.0"
description = "打流测试 Tauri 外壳（Go 引擎以 sidecar 方式内嵌）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
